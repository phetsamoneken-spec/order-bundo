                        <span className="font-bold text-[#131b2e] truncate">
                          {order.customerName || 'ລູກຄ້າທົ່ວໄປ'}
                        </span>
                        {(order.customerPhone || order.phone) && (
                          <span className="text-gray-500 font-display text-[11px]">
                            ({order.customerPhone || order.phone})
                          </span>
                        )}
                      </div>

                      {/* Items Summary & Accordion */}
                      <div className="text-xs text-[#131b2e] bg-[#faf8ff] p-2.5 rounded-xl border border-gray-100 flex flex-col gap-1.5">
                        <div className="flex items-center justify-between">
                          <span className="font-medium text-gray-700 truncate flex-1 pr-2">
                            {order.items.map((it) => `${it.productName} (x${it.quantity})`).join(', ')}
                          </span>
                          <button
                            type="button"
                            onClick={() => toggleExpand(order.id)}
                            className="text-[11px] font-bold text-[#006c49] hover:underline flex items-center gap-0.5 shrink-0"
                          >
                            <span>{isExpanded ? 'ຫຍໍ້' : 'ແຍກລາຍການ'}</span>
                            <span className="material-symbols-outlined text-[14px]">
                              {isExpanded ? 'expand_less' : 'expand_more'}
                            </span>
                          </button>
                        </div>

                        {/* Expanded Itemized Breakdown */}
                        {isExpanded && (
                          <div className="pt-2 mt-1 border-t border-gray-200/80 flex flex-col gap-1 text-[11px]">
                            {order.items.map((it, idx) => (
                              <div key={idx} className="flex justify-between items-center text-gray-700 py-0.5">
                                <span>• {it.productName} × {it.quantity}</span>
                                <span className="font-display font-semibold text-[#006c49]">
                                  {formatKip(it.unitPrice * it.quantity)} ກີບ
                                </span>
                              </div>
                            ))}
                            {order.discount > 0 && (
                              <div className="flex justify-between items-center text-[#ba1a1a] pt-1">
                                <span>ສ່ວນຫຼຸດ:</span>
                                <span className="font-display font-semibold">-{formatKip(order.discount)} ກີບ</span>
                              </div>
                            )}
                          </div>
                        )}

                        {order.notes && (
                          <div className="text-[11px] text-amber-800 bg-amber-50 px-2 py-1 rounded-lg border border-amber-100 truncate">
                            📝 ໝາຍເຫດ: {order.notes}
                          </div>
                        )}
                      </div>

                      {/* Price & Summary Tag */}
                      <div className="flex items-center justify-between border-t border-gray-100 pt-2 px-0.5">
                        <span className="text-[11px] text-gray-500 font-medium">
                          {totalQty} ລາຍການ
                        </span>
                        <div className="flex items-baseline gap-1 text-[#006c49]">
                          <span className="font-display font-black text-[19px] leading-none">
                            {formatKip(order.total)}
                          </span>
                          <span className="text-[11px] font-bold">ກີບ</span>
                        </div>
                      </div>

                      {/* Clean 2-Row Action Bar */}
                      <div className="flex items-center gap-2 pt-0.5">
                        {/* Primary WhatsApp Action Button */}
                        <button
                          type="button"
                          onClick={() => handleResendWhatsApp(order)}
                          className="flex-1 h-9 px-3 bg-[#25d366] hover:bg-[#20ba5a] text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-xs active:scale-95 transition-all"
                        >
                          <span className="material-symbols-outlined text-[17px]">chat</span>
                          <span>ສົ່ງ WhatsApp</span>
                        </button>

                        {/* View Full Details Button */}
                        <button
                          type="button"
                          onClick={() => { vibrateSoft(15); setSelectedOrderDetail(order); }}
                          className="h-9 px-3 rounded-xl bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] text-xs font-bold flex items-center justify-center gap-1 border border-[#a7f3d0] active:scale-95 transition-all"
                          title="ເບິ່ງລາຍລະອຽດເຕັມ"
                        >
                          <span className="material-symbols-outlined text-[16px]">visibility</span>
                          <span>ລາຍລະອຽດ</span>
                        </button>

                        {/* Map Location Shortcut */}
                        {order.location && (
                          <a
                            href={`https://www.google.com/maps?q=${order.location.lat},${order.location.lng}`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-[#006c49] flex items-center justify-center transition-colors shrink-0"
                            title="ເປີດແຜນທີ່ສົ່ງ"
                          >
                            <span className="material-symbols-outlined text-[17px]">location_on</span>
                          </a>
                        )}

                        {/* Copy Slip */}
                        <button
                          type="button"
                          onClick={() => handleCopyOrderSlip(order)}
                          className="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-[#131b2e] flex items-center justify-center transition-colors shrink-0"
                          title="ຄັດລອກໃບບິນ"
                        >
                          <span className="material-symbols-outlined text-[17px]">content_copy</span>
                        </button>

                        {/* Delete Order */}
                        <button
                          type="button"
                          onClick={() => setOrderToDelete(order.id)}
                          className="w-9 h-9 rounded-xl hover:bg-red-50 text-gray-400 hover:text-red-600 flex items-center justify-center transition-colors shrink-0"
                          title="ລຶບບິນນີ້"
                        >
                          <span className="material-symbols-outlined text-[17px]">delete</span>
                        </button>
                      </div>
                    </div>
                  );
                })}

                <div className="pt-2 text-center">
                  <button
                    onClick={() => setShowClearConfirm(true)}
                    className="text-[12px] text-gray-400 hover:text-red-600 transition-colors font-semibold"
                  >
                    ລຶບປະຫວັດບິນທັງໝົດ
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      };

      const CatalogTab = ({
        products,
        profile,
        onAddProduct,
        onDeleteProduct,
        onResetProducts,
        onOpenStoreSettings,
        onShowToast,
      }) => {
        const [showAddModal, setShowAddModal] = useState(false);
        const [name, setName] = useState('');
        const [nameEn, setNameEn] = useState('');
        const [sub, setSub] = useState('');
        const [category, setCategory] = useState('drinks');
        const [price, setPrice] = useState('25000');
        const [badgeText, setBadgeText] = useState('');
        const [badgeType, setBadgeType] = useState('bestseller');
        const [imageUrl, setImageUrl] = useState('');
        const [isCompressing, setIsCompressing] = useState(false);
        const [productToDelete, setProductToDelete] = useState(null);
        const [showResetConfirm, setShowResetConfirm] = useState(false);

        const fileInputRef = useRef(null);

        const handleImageFile = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            setIsCompressing(true);
            const dataUrl = await compressImage(file, 400, 0.75);
            setImageUrl(dataUrl);
            onShowToast('ເລືອກຮູບສິນຄ້າຮຽບຮ້ອຍ', 'success');
          } catch (err) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການອັບໂຫຼດຮູບ', 'error');
          } finally {
            setIsCompressing(false);
          }
        };

        const handleSaveProduct = (e) => {
          e.preventDefault();
          if (!name.trim()) {
            onShowToast('ກະລຸນາໃສ່ຊື່ສິນຄ້າ', 'warning');
            return;
          }
          const numPrice = parseInt(price, 10);
          if (isNaN(numPrice) || numPrice <= 0) {
            onShowToast('ກະລຸນາໃສ່ລາຄາທີ່ຖືກຕ້ອງ', 'warning');
            return;
          }

          const fallbackImages = {
            drinks: 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500&auto=format&fit=crop&q=80',
            food: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80',
            desserts: 'https://images.unsplash.com/photo-1587314168485-3236d6710814?w=500&auto=format&fit=crop&q=80',
          };

          const newProd = {
            id: `item-${Date.now()}`,
            name: name.trim(),
            nameEn: nameEn.trim() || name.trim(),
            sub: sub.trim() || 'ລາຍການສິນຄ້າ',
            category,
            price: numPrice,
            image: imageUrl.trim() || fallbackImages[category],
            badgeText: badgeText.trim() || undefined,
            badgeType: badgeText.trim() ? badgeType : undefined,
          };

          onAddProduct(newProd);
          onShowToast(`ເພີ່ມເມນູ "${newProd.name}" ສຳເລັດ!`, 'success');
          setName('');
          setNameEn('');
          setSub('');
          setPrice('25000');
          setBadgeText('');
          setImageUrl('');
          setShowAddModal(false);
        };

        return (
          <div className="flex flex-col w-full pb-32 max-w-lg mx-auto px-4 pt-2">
            <ConfirmModal
              isOpen={!!productToDelete}
              title={`ລຶບເມນູ "${productToDelete?.name}"?`}
              message="ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບເມນູສິນຄ້ານີ້ອອກຈາກລະບົບ?"
              onCancel={() => setProductToDelete(null)}
              onConfirm={() => {
                if (productToDelete) {
                  onDeleteProduct(productToDelete.id);
                  onShowToast(`ລຶບ "${productToDelete.name}" ຮຽບຮ້ອຍ`, 'info');
                  setProductToDelete(null);
                }
              }}
            />

            <ConfirmModal
              isOpen={showResetConfirm}
              title="ຣີເຊັດເປັນຄ່າເລີ່ມຕົ້ນ?"
              message="ສິນຄ້າທັງໝົດຈະຖືກຣີເຊັດກັບຄືນເປັນເມນູຕົວຢ່າງຕົ້ນສະບັບ."
              onCancel={() => setShowResetConfirm(false)}
              onConfirm={() => {
                setShowResetConfirm(false);
                onResetProducts();
                onShowToast('ຣີເຊັດເມນູກັບຄືນຄ່າເລີ່ມຕົ້ນແລ້ວ', 'success');
              }}
            />

            <div className="flex items-center justify-between mb-4">
              <div>
                <h1 className="font-display font-bold text-[22px] text-[#006c49]">ຈັດການເມນູ & ຮ້ານຄ້າ</h1>
                <p className="text-[13px] text-[#3c4a42]">ທັງໝົດ {products.length} ລາຍການ</p>
              </div>
              <button
                onClick={() => { vibrateSoft(); setShowAddModal(true); }}
                className="flex items-center gap-1.5 bg-[#006c49] hover:bg-[#005236] text-white px-3.5 py-2 rounded-xl text-[13px] font-bold shadow-md active:scale-95 transition-all"
              >
                <span className="material-symbols-outlined text-[18px]">add_circle</span>
                <span>ເພີ່ມເມນູໃໝ່</span>
              </button>
            </div>

            {/* Store Information Card */}
            {profile && onOpenStoreSettings && (
              <div className="mb-4 bg-white rounded-3xl p-4 shadow-sm border border-emerald-900/10 flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                  {profile.logoUrl ? (
                    <img src={profile.logoUrl} alt={profile.name} className="w-12 h-12 rounded-2xl object-cover shadow-xs border border-emerald-900/10 bg-[#faf8ff] shrink-0" />
                  ) : (
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#006c49] to-[#10b981] flex items-center justify-center text-white shrink-0 shadow-xs">
                      <span className="material-symbols-outlined text-[26px]">{profile.logoIcon || 'point_of_sale'}</span>
                    </div>
                  )}
                  <div className="min-w-0">
                    <span className="text-[11px] font-bold text-gray-400 block uppercase">ຂໍ້ມູນຮ້ານຄ້າ</span>
                    <h3 className="font-display font-bold text-[16px] text-[#006c49] truncate">{profile.name}</h3>
                    <p className="text-[12px] text-gray-500 truncate">{profile.phone || '-'}</p>
                  </div>
                </div>
                <button
                  onClick={() => { vibrateSoft(); onOpenStoreSettings(); }}
                  className="py-2 px-3.5 bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] font-bold text-[12px] rounded-xl flex items-center gap-1.5 shrink-0 border border-[#a7f3d0] active:scale-95 transition-all"
                >
                  <span className="material-symbols-outlined text-[16px]">edit</span>
                  <span>ແກ້ໄຂ</span>
                </button>
              </div>
            )}

            {/* Product List */}
            <div className="flex flex-col gap-2.5">
              {products.map((prod) => (
                <div key={prod.id} className="bg-white rounded-2xl p-3 shadow-xs border border-gray-100 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <img src={prod.image} alt={prod.name} className="w-14 h-14 rounded-xl object-cover bg-[#ecfdf5] shrink-0" />
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5">
                        <h4 className="font-display font-bold text-[15px] text-[#131b2e] truncate">{prod.name}</h4>
                        {prod.badgeText && (
                          <span className="bg-[#ecfdf5] text-[#006c49] font-bold text-[10px] px-1.5 py-0.5 rounded-md">
                            {prod.badgeText}
                          </span>
                        )}
                      </div>
                      <p className="text-[12px] text-gray-500 truncate">{prod.nameEn} • {prod.sub}</p>
                      <p className="text-[13px] font-display font-black text-[#006c49] mt-0.5">{formatKip(prod.price)} ກີບ</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setProductToDelete(prod)}
                    className="w-9 h-9 rounded-xl hover:bg-red-50 text-gray-400 hover:text-red-600 flex items-center justify-center transition-colors shrink-0"
                    title="ລຶບສິນຄ້າ"
                  >
                    <span className="material-symbols-outlined text-[18px]">delete</span>
                  </button>
                </div>
              ))}
            </div>

            {/* Reset Defaults Button */}
            <div className="pt-6 text-center">
              <button
                onClick={() => setShowResetConfirm(true)}
                className="text-[12px] text-gray-400 hover:text-[#006c49] font-bold underline transition-colors"
              >
                ຣີເຊັດກັບຄືນຄ່າເລີ່ມຕົ້ນ (Reset to Defaults)
              </button>
            </div>

            {/* Add Product Modal */}
            {showAddModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
                <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-emerald-900/10 flex flex-col gap-4 max-h-[90vh] overflow-y-auto no-scrollbar">
                  <div className="flex items-center justify-between">
                    <h3 className="font-display font-bold text-lg text-[#006c49]">ເພີ່ມເມນູໃໝ່</h3>
                    <button onClick={() => setShowAddModal(false)} className="text-gray-400 hover:text-gray-600 p-1">
                      <span className="material-symbols-outlined text-[20px]">close</span>
                    </button>
                  </div>
                  <form onSubmit={handleSaveProduct} className="flex flex-col gap-3">
                    <div>
                      <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ຊື່ເມນູ (ພາສາລາວ) *</label>
                      <input
                        type="text"
                        required
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        placeholder="ກາເຟເຢັນ..."
                        className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ຊື່ພາສາອັງກິດ</label>
                        <input
                          type="text"
                          value={nameEn}
                          onChange={(e) => setNameEn(e.target.value)}
                          placeholder="Matcha Latte"
                          className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                        />
                      </div>
                      <div>
                        <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ລາຍລະອຽດຍ່ອຍ</label>
                        <input
                          type="text"
                          value={sub}
                          onChange={(e) => setSub(e.target.value)}
                          placeholder="ຫວານກາງ, ຊັອດຄູ່"
                          className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ໝວດໝູ່</label>
                        <select
                          value={category}
                          onChange={(e) => setCategory(e.target.value)}
                          className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                        >
                          <option value="drinks">ເຄື່ອງດື່ມ</option>
                          <option value="food">ອາຫານ</option>
                          <option value="desserts">ຂອງຫວານ</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ລາຄາ (ກີບ) *</label>
                        <input
                          type="number"
                          step="1000"
                          required
                          value={price}
                          onChange={(e) => setPrice(e.target.value)}
                          className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] font-display font-bold text-[#006c49] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ປ້າຍກຳກັບ (Badge)</label>
                        <input
                          type="text"
                          value={badgeText}
                          onChange={(e) => setBadgeText(e.target.value)}
                          placeholder="ຂາຍດີ, ເຜັດ..."
                          className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                        />
                      </div>
                      <div>
                        <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ປະເພດປ້າຍ</label>
                        <select
                          value={badgeType}
                          onChange={(e) => setBadgeType(e.target.value)}
                          className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                        >
                          <option value="bestseller">ດາວຄຳ (Star)</option>
                          <option value="recommended">ສີຂຽວ (Recommended)</option>
                          <option value="spicy">ສີແດງເຜັດ (Spicy)</option>
                          <option value="sweet">ສີເທົາ (Subtle)</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ຮູບພາບສິນຄ້າ</label>
                      <div className="flex gap-2 items-center">
                        <input type="file" ref={fileInputRef} accept="image/*" onChange={handleImageFile} className="hidden" />
                        <button
                          type="button"
                          onClick={() => fileInputRef.current?.click()}
                          disabled={isCompressing}
                          className="flex-1 py-2 px-3 bg-[#faf8ff] hover:bg-[#ecfdf5] border border-dashed border-[#006c49]/40 rounded-xl text-[12px] font-bold text-[#006c49] flex items-center justify-center gap-1.5"
                        >
                          <span className="material-symbols-outlined text-[18px]">upload</span>
                          <span>{imageUrl ? 'ປ່ຽນຮູບພາບ' : 'ອັບໂຫຼດຮູບພາບ'}</span>
                        </button>
                        {imageUrl && (
                          <img src={imageUrl} alt="Preview" className="w-10 h-10 rounded-xl object-cover border border-emerald-800/10 shrink-0" />
                        )}
                      </div>
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setShowAddModal(false)}
                        className="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-[13px] transition-colors"
                      >
                        ຍົກເລີກ
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2.5 bg-[#006c49] hover:bg-[#005236] text-white font-bold rounded-xl text-[13px] shadow-sm transition-all active:scale-95"
                      >
                        ບັນທຶກເມນູ
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      };

      function App() {
        const [activeTab, setActiveTab] = useState('pos-menu');

        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_products');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_PRODUCTS;
        });

        const [cart, setCart] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_cart');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return { 'item-1': 2, 'item-2': 1, 'item-5': 1 };
        });

        const [orders, setOrders] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_orders');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_DEMO_ORDERS;
        });

        const [profile, setProfile] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_profile');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_STORE_PROFILE;
        });

        const [toasts, setToasts] = useState([]);
        const [isGpsModalOpen, setIsGpsModalOpen] = useState(false);
        const [isStoreSettingsOpen, setIsStoreSettingsOpen] = useState(false);
        const [isPermissionModalOpen, setIsPermissionModalOpen] = useState(false);
        const [permState, setPermState] = useState('prompt'); // 'granted', 'prompt', 'denied'

        // Check permission state on load
        useEffect(() => {
          checkGeoPermission().then((st) => setPermState(st));
        }, []);

        const triggerBrowserPermissionPrompt = async () => {
          return new Promise((resolve) => {
            if (!navigator.geolocation) {
              showToast('ບຣາວເຊີນີ້ບໍ່ຮອງຮັບ Geolocation', 'warning');
              resolve(false);
              return;
            }
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const lat = Number(pos.coords.latitude.toFixed(6));
                const lng = Number(pos.coords.longitude.toFixed(6));
                const acc = Math.round(pos.coords.accuracy || 10);
                setPermState('granted');
                handleUpdateProfile({ lat, lng, gpsAccuracy: acc });
                showToast(`ອະນຸຍາດ GPS ສຳເລັດ! (±${acc}m)`, 'success');
                setIsPermissionModalOpen(false);
                resolve(true);
              },
              (err) => {
                if (err.code === err.PERMISSION_DENIED) {
                  setPermState('denied');
                  showToast('ສິດ GPS ຖືກປະຕິເສດ ກະລຸນາເປີດໃນການຕັ້ງຄ່າບຣາວເຊີ', 'warning');
                } else {
                  showToast('ບໍ່ສາມາດດຶງ GPS ໄດ້ໃນຕອນນີ້', 'error');
                }
                resolve(false);
              },
              { enableHighAccuracy: true, timeout: 8000 }
            );
          });
        };

        useEffect(() => {
          try { localStorage.setItem('lao_pos_products', JSON.stringify(products)); } catch (e) {}
        }, [products]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_cart', JSON.stringify(cart)); } catch (e) {}
        }, [cart]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_orders', JSON.stringify(orders)); } catch (e) {}
        }, [orders]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_profile', JSON.stringify(profile)); } catch (e) {}
        }, [profile]);

        const showToast = (message, type = 'info') => {
          const id = `${Date.now()}-${Math.random()}`;
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 3500);
        };

        const dismissToast = (id) => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        };

        const handleUpdateQty = (productId, delta) => {
          setCart((prev) => {
            const current = prev[productId] || 0;
            const next = current + delta;
            if (next <= 0) {
              const copy = { ...prev };
              delete copy[productId];
              return copy;
            }
            return { ...prev, [productId]: next };
          });
        };

        const handleSetQty = (productId, quantity) => {
          setCart((prev) => {
            if (quantity <= 0) {
              const copy = { ...prev };
              delete copy[productId];
              return copy;
            }
            return { ...prev, [productId]: Math.min(999, quantity) };
          });
        };

        const handleClearCart = () => {
          setCart({});
        };

        const handleUpdateProfile = (updated) => {
          setProfile((prev) => ({ ...prev, ...updated }));
        };

        const handleOrderCompleted = (newOrder) => {
          setOrders((prev) => [newOrder, ...prev]);
        };

        const handleToggleOrderStatus = (orderId) => {
          setOrders((prev) =>
            prev.map((order) => {
              if (order.id === orderId) {
                const nextStatus = order.status === 'delivered' ? 'pending' : 'delivered';
                return { ...order, status: nextStatus };
              }
              return order;
            })
          );
        };

        const handleAddProduct = (newProd) => {
          setProducts((prev) => [newProd, ...prev]);
        };

        const handleDeleteProduct = (id) => {
          setProducts((prev) => prev.filter((p) => p.id !== id));
          setCart((prev) => {
            if (prev[id]) {
              const copy = { ...prev };
              delete copy[id];
              return copy;
            }
            return prev;
          });
        };

        const handleResetProducts = () => {
          setProducts(INITIAL_PRODUCTS);
        };

        const cartTotalCount = Object.values(cart).reduce((sum, q) => sum + q, 0);

        return (
          <div className="min-h-screen bg-[#faf8ff] text-[#131b2e] flex flex-col antialiased">
            <Toast toasts={toasts} onDismiss={dismissToast} />

            <PermissionGuideModal
              isOpen={isPermissionModalOpen}
              onClose={() => setIsPermissionModalOpen(false)}
              permState={permState}
              onRequestPermission={triggerBrowserPermissionPrompt}
              onShowToast={showToast}
            />

            <GpsModal
              isOpen={isGpsModalOpen}
              onClose={() => setIsGpsModalOpen(false)}
              currentLat={profile.lat}
              currentLng={profile.lng}
              permState={permState}
              onOpenPermissionModal={() => { setIsGpsModalOpen(false); setIsPermissionModalOpen(true); }}
              onUpdateLocation={(lat, lng, acc) => handleUpdateProfile({ lat, lng, ...(acc ? { gpsAccuracy: acc } : {}) })}
              onShowToast={showToast}
            />

            <StoreSettingsModal
              isOpen={isStoreSettingsOpen}
              onClose={() => setIsStoreSettingsOpen(false)}
              profile={profile}
              onUpdateProfile={handleUpdateProfile}
              onShowToast={showToast}
            />

            <Header
              activeTab={activeTab}
              profile={profile}
              onEditStore={() => { vibrateSoft(); setIsStoreSettingsOpen(true); }}
              onOpenGpsModal={() => setIsGpsModalOpen(true)}
              onQuickSync={() => {
                vibrateSoft();
                showToast('ຊິ້ງຂໍ້ມູນບັນທຶກໃນເຄື່ອງສຳເລັດ!', 'success');
              }}
            />

            {/* Permission Alert Bar if not granted */}
            {permState === 'denied' && (
              <div className="bg-rose-50 border-b border-rose-200 px-4 py-2 flex items-center justify-between text-xs text-rose-800">
                <div className="flex items-center gap-1.5 truncate">
                  <span className="material-symbols-outlined text-[16px] shrink-0 text-rose-600">error</span>
                  <span className="truncate">ສິດ GPS ຖືກບລັອກ (Location Denied)</span>
                </div>
                <button
                  type="button"
                  onClick={() => setIsPermissionModalOpen(true)}
                  className="px-2 py-1 bg-rose-600 text-white rounded-lg font-bold text-[11px] shrink-0 ml-2"
                >
                  ແກ້ໄຂສິດ
                </button>
              </div>
            )}

            <main className="flex-1 w-full pt-16">
              {activeTab === 'pos-menu' && (
                <MenuTab
                  products={products}
                  cart={cart}
                  onUpdateQty={handleUpdateQty}
                  onSetQty={handleSetQty}
                  onGoToCart={() => { vibrateSoft(); setActiveTab('cart-and-whatsapp'); }}
                />
              )}
              {activeTab === 'cart-and-whatsapp' && (
                <CartTab
                  products={products}
                  cart={cart}
                  onUpdateQty={handleUpdateQty}
                  onSetQty={handleSetQty}
                  onClearCart={handleClearCart}
                  profile={profile}
                  onUpdateProfile={handleUpdateProfile}
                  onOrderCompleted={handleOrderCompleted}
                  onShowToast={showToast}
                  onGoToMenu={() => { vibrateSoft(); setActiveTab('pos-menu'); }}
                  onOpenPermissionModal={() => setIsPermissionModalOpen(true)}
                />
              )}
              {activeTab === 'sales-dashboard' && (
                <DashboardTab orders={orders} products={products} />
              )}
              {activeTab === 'order-history' && (
                <OrdersTab
                  orders={orders}
                  onDeleteOrder={(id) => setOrders((prev) => prev.filter((o) => o.id !== id))}
                  onClearAllOrders={() => setOrders([])}
                  onToggleOrderStatus={handleToggleOrderStatus}
                  profile={profile}
                  onShowToast={showToast}
                />
              )}
              {activeTab === 'catalog-settings' && (
                <CatalogTab
                  products={products}
                  profile={profile}
                  onOpenStoreSettings={() => { vibrateSoft(); setIsStoreSettingsOpen(true); }}
                  onAddProduct={handleAddProduct}
                  onDeleteProduct={handleDeleteProduct}
                  onResetProducts={handleResetProducts}
                  onShowToast={showToast}
                />
              )}
            </main>

            <BottomNav activeTab={activeTab} onChangeTab={setActiveTab} cartTotalCount={cartTotalCount} />
          </div>
        );
      }

      function startApp() {
        let root = document.getElementById('root');
        if (!root) {
          root = document.createElement('div');
          root.id = 'root';
          document.body.appendChild(root);
        }
        ReactDOM.createRoot(root).render(<App />);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }
    </script>
  </body>
</html>
