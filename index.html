      // Audio synthesizer for soft interaction feedback using Tone.js
      let synth = null;
      function playFeedbackSound(type = 'click') {
        try {
          if (!synth && window.Tone) {
            synth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: 'sine' },
              envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 },
            }).toDestination();
            synth.volume.value = -12;
          }
          if (synth && Tone.context.state === 'running') {
            if (type === 'click') {
              synth.triggerAttackRelease('C5', '0.05');
            } else if (type === 'success') {
              synth.triggerAttackRelease(['E5', 'G5', 'C6'], '0.12');
            } else if (type === 'delete') {
              synth.triggerAttackRelease('A3', '0.08');
            }
          }
        } catch (e) {
          // Audio context might be waiting for user gesture
        }
      }

      function vibrateSoft(duration = 20) {
        if (typeof window !== 'undefined' && 'vibrate' in navigator) {
          try {
            navigator.vibrate(duration);
          } catch (e) {}
        }
        playFeedbackSound('click');
      }

            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          });
        } catch (e) {
          return isoString;
        }
      }

      function compressImage(file, maxWidth = 640, quality = 0.75) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                resolve(e.target.result);
                return;
              }
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      /**
       * Check Geolocation Permission status
       * Returns: 'granted' | 'prompt' | 'denied' | 'unsupported'
       */
      async function checkGeoPermission() {
        if (!navigator.permissions || !navigator.geolocation) {
          return 'unsupported';
        }
        try {
          const res = await navigator.permissions.query({ name: 'geolocation' });
          return res.state; // 'granted', 'prompt', 'denied'
        } catch (e) {
          return 'prompt';
        }
      }

      /**
       * High-Precision Satellite GPS Position Engine
       * Uses watchPosition with maximumAge: 0 to progressively refine satellite lock
       * down to ≤ 15 meters, with fallback mechanisms.
       */
      function getDeviceLocation(onProgress) {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            // Fallback for completely unsupported environments
            fetch('https://get.geojs.io/v1/ip/geo.json')
              .then(res => res.json())
              .then(data => {
                resolve({
                  lat: Number(parseFloat(data.latitude).toFixed(6)),
                  lng: Number(parseFloat(data.longitude).toFixed(6)),
                  accuracy: 500,
                  source: 'Network IP'
                });
              })
              .catch(() => reject(new Error('GEOLOCATION_NOT_SUPPORTED')));
            return;
          }

          let bestPos = null;
          let watchId = null;
          let timeoutHandle = null;

          const finish = (pos) => {
            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
              watchId = null;
            }
            if (timeoutHandle !== null) {
              clearTimeout(timeoutHandle);
              timeoutHandle = null;
            }
            if (pos) {
              resolve({
                lat: Number(pos.coords.latitude.toFixed(6)),
                lng: Number(pos.coords.longitude.toFixed(6)),
                accuracy: Math.round(pos.coords.accuracy || 10),
                altitude: pos.coords.altitude ? Math.round(pos.coords.altitude) : null,
                source: pos.coords.accuracy <= 25 ? 'GPS ດາວທຽມ (High Precision)' : 'Wi-Fi/Cellular'
              });
            } else {
              // Try final single-shot standard fallback
              navigator.geolocation.getCurrentPosition(
                (p) => resolve({
                  lat: Number(p.coords.latitude.toFixed(6)),
                  lng: Number(p.coords.longitude.toFixed(6)),
                  accuracy: Math.round(p.coords.accuracy || 50),
                  source: 'Standard GPS'
                }),
                async (err) => {
                  try {
                    const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                    const data = await res.json();
                    resolve({
                      lat: Number(parseFloat(data.latitude).toFixed(6)),
                      lng: Number(parseFloat(data.longitude).toFixed(6)),
                      accuracy: 500,
                      source: 'Network IP'
                    });
                  } catch (e) {
                    reject(err);
                  }
                },
                { enableHighAccuracy: false, timeout: 6000 }
              );
            }
          };

          // Maximum wait time of 12 seconds for the highest satellite accuracy lock
          timeoutHandle = setTimeout(() => {
            finish(bestPos);
          }, 12000);

          try {
            watchId = navigator.geolocation.watchPosition(
              (pos) => {
                const acc = Math.round(pos.coords.accuracy || 999);
                if (onProgress) {
                  onProgress({
                    lat: Number(pos.coords.latitude.toFixed(6)),
                    lng: Number(pos.coords.longitude.toFixed(6)),
                    accuracy: acc,
                  });
                }

                if (!bestPos || pos.coords.accuracy < bestPos.coords.accuracy) {
                  bestPos = pos;
                }

                // If satellite precision reached 15 meters or less, resolve immediately!
                if (acc <= 15) {
                  finish(bestPos);
                }
              },
              (err) => {
                if (!bestPos && err.code === err.PERMISSION_DENIED) {
                  clearTimeout(timeoutHandle);
                  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                  reject(err);
                }
              },
              {
                enableHighAccuracy: true,
                maximumAge: 0, // Force fresh satellite hardware scan
                timeout: 10000,
              }
            );
          } catch (e) {
            finish(null);
          }
        });
      }

      function buildWhatsAppSlip(cartItems, subtotal, discount, total, notes, profile, orderId) {
        const currentId = orderId || `ORD-${Math.floor(100000 + Math.random() * 900000)}`;
        const dateStr = formatDateTimeLao(new Date().toISOString());
        const lines = [
          `🧾 *ໃບສັ່ງຊື້ / ORDER SUMMARY*`,
          `🏪 *ຮ້ານ:* ${profile.name}`,
          `👤 *ລູກຄ້າ:* ${profile.customerName || profile.ownerName || 'ລູກຄ້າທົ່ວໄປ'}`,
          `📱 *ເບີໂທ:* ${profile.customerPhone || profile.phone || '-'}`,
          `🔢 *ລະຫັດບິນ:* ${currentId}`,
          `⏰ *ເວລາ:* ${dateStr}`,
        ];

        if (profile.lat && profile.lng) {
          const accText = profile.gpsAccuracy ? ` (ຄວາມແມ່ນຍຳ ±${profile.gpsAccuracy}m)` : '';
          const tag = profile.isLiveGps ? '🔴 *ຕຳແໜ່ງ GPS ສົດ (Real-time Live Location)*' : '📍 *Location (ແຜນທີ່ຮ້ານ)*';
          lines.push(`${tag}: https://www.google.com/maps?q=${Number(profile.lat).toFixed(6)},${Number(profile.lng).toFixed(6)}${accText}`);
        }

        if (profile.photoUrl) {
          lines.push(`📸 *ຮູບພາບໜ້າຮ້ານ:* (ແນບພ້ອມຂໍ້ຄວາມ)`);
        }

        lines.push(`---------------------------`);
        lines.push(`📋 *ລາຍການອາຫານ & ເຄື່ອງດື່ມ:*`);
        cartItems.forEach((item, index) => {
          const itemTotal = item.product.price * item.quantity;
          lines.push(`${index + 1}. ${item.product.name} × ${item.quantity} = ${formatKip(itemTotal)} ກີບ`);
        });

        lines.push(`---------------------------`);
        lines.push(`💰 *ຍອດລວມ:* ${formatKip(subtotal)} ກີບ`);
        if (discount > 0) {
          lines.push(`🏷️ *ສ່ວນຫຼຸດ:* -${formatKip(discount)} ກີບ`);
        }
        lines.push(`💵 *ຍອດສຸດທິ:* *${formatKip(total)} ກີບ*`);

        if (notes && notes.trim()) {
          lines.push(`📝 *ໝາຍເຫດ:* ${notes.trim()}`);
        }

        lines.push(`🙏 *ຂອບໃຈທີ່ໃຊ້ບໍລິການ!*`);
        return lines.join('\n');
      }

      function exportOrdersToCSV(orders) {
        if (!orders || orders.length === 0) return;
        const headers = ['Order ID', 'Date', 'Customer Name', 'Phone', 'Items', 'Total (LAK)', 'Status', 'Dispatch Mode'];
        const rows = orders.map(o => [
          o.id,
          o.createdAt,
          `"${(o.customerName || '').replace(/"/g, '""')}"`,
          `"${(o.customerPhone || o.phone || '').replace(/"/g, '""')}"`,
          `"${(o.items || []).map(i => `${i.productName}x${i.quantity}`).join('; ').replace(/"/g, '""')}"`,
          o.total,
          o.status || 'pending',
          o.dispatchMode || 'group'
        ]);
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `orders_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

        if (!toasts || toasts.length === 0) return null;
        return (

            {toasts.map((toast) => {
              let bg = 'bg-[#131b2e] text-white';
              let icon = 'info';
              if (toast.type === 'success') {
                bg = 'bg-[#006c49] text-white';
                icon = 'check_circle';
              } else if (toast.type === 'warning') {
                bg = 'bg-amber-600 text-white';
                icon = 'warning';
              } else if (toast.type === 'error') {
                bg = 'bg-rose-600 text-white';
                icon = 'error';
              }
              return (
                <div
                  key={toast.id}
                  className={`pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-2xl shadow-xl border border-white/20 text-xs font-bold max-w-sm w-full animate-slideUp transition-all ${bg}`}
                >
                  <span className="material-symbols-outlined text-[18px] shrink-0">{icon}</span>
                  <span className="flex-1 leading-tight">{toast.message}</span>
                  <button
                    type="button"
                    onClick={() => onDismiss(toast.id)}
                    className="text-white/80 hover:text-white p-0.5 rounded-lg shrink-0 transition-opacity"
                  >
                    <span className="material-symbols-outlined text-[16px]">close</span>
                  </button>
                </div>
              );
            })}
          </div>
        );
      };

      const ConfirmModal = ({ isOpen, title, message, onCancel, onConfirm }) => {
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl border border-emerald-900/10 flex flex-col gap-3.5">
              <div className="w-11 h-11 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto">
                <span className="material-symbols-outlined text-[24px]">help</span>
              </div>
              <div className="text-center">
                <h3 className="font-display font-bold text-base text-[#131b2e] leading-snug">{title}</h3>
                {message && <p className="text-xs text-[#3c4a42] mt-1 leading-relaxed">{message}</p>}
              </div>
              <div className="grid grid-cols-2 gap-2 mt-1">
                <button
                  type="button"
                  onClick={onCancel}
                  className="py-2.5 px-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors active:scale-95"
                >
                  ຍົກເລີກ
                </button>
                <button
                  type="button"
                  onClick={onConfirm}
                  className="py-2.5 px-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-xs transition-all active:scale-95"
                >
                  ຢືນຢັນ
                </button>
              </div>
            </div>
          </div>
        );
      };

      /**
       * Permission Modal & Guide for GPS
       * Allows direct single-click prompt trigger, and provides clear Lao visual instructions if denied.
       */
      const PermissionGuideModal = ({ isOpen, onClose, permState, onRequestPermission, onShowToast }) => {
        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-[95] flex items-center justify-center p-4 bg-black/65 backdrop-blur-xs animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-emerald-900/15 flex flex-col gap-3.5 max-h-[90vh] overflow-y-auto no-scrollbar">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-2xl bg-emerald-50 text-[#006c49] flex items-center justify-center shrink-0">
                    <span className="material-symbols-outlined text-[24px]">security</span>
                  </div>
                  <div>
                    <h3 className="font-display font-bold text-[16px] text-[#006c49] leading-tight">
                      ສິດອະນຸຍາດ GPS (Location)
                    </h3>
                    <p className="text-[11px] text-[#3c4a42]">ກວດສອບ ແລະ ເປີດສິດສະຖານທີ່</p>
                  </div>
                </div>
                <button
                  onClick={onClose}
                  className="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-400 flex items-center justify-center"
                >
                  <span className="material-symbols-outlined text-[18px]">close</span>
                </button>
              </div>

              {/* Status Indicator */}
              <div className="p-3 rounded-2xl border flex items-center justify-between text-xs font-semibold ${
                permState === 'granted'
                  ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                  : permState === 'denied'
                  ? 'bg-rose-50 text-rose-800 border-rose-200'
                  : 'bg-amber-50 text-amber-800 border-amber-200'
              }">
                <div className="flex items-center gap-2">
                  <span className="material-symbols-outlined text-[18px]">
                    {permState === 'granted' ? 'check_circle' : permState === 'denied' ? 'block' : 'help_outline'}
                  </span>
                  <span>ສະຖານະສິດ:</span>
                </div>
                <span className="font-bold px-2 py-0.5 rounded-lg bg-white/80 shadow-2xs">
                  {permState === 'granted'
                    ? 'ອະນຸຍາດແລ້ວ (Granted) ✓'
                    : permState === 'denied'
                    ? 'ຖືກບລັອກ (Denied) ❌'
                    : 'ລໍຖ້າອະນຸຍາດ (Prompt) ⚠️'}
                </span>
              </div>

              {/* Trigger Button */}
              {permState !== 'granted' && (
                <button
                  type="button"
                  onClick={async () => {
                    vibrateSoft(30);
                    await onRequestPermission();
                  }}
                  className="w-full py-3.5 px-4 bg-gradient-to-r from-[#006c49] to-[#10b981] hover:from-[#005236] hover:to-[#059669] text-white rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/15 active:scale-95 transition-all text-[14px]"
                >
                  <span className="material-symbols-outlined text-[20px]">near_me</span>
                  <span>ກົດອະນຸຍາດ GPS ທັນທີ (Allow GPS)</span>
                </button>
              )}

              {/* Step by step guide if denied or needed */}
              <div className="flex flex-col gap-2 pt-1 border-t border-gray-100">
                <span className="text-[12px] font-bold text-[#131b2e] flex items-center gap-1">
                  <span className="material-symbols-outlined text-[16px] text-amber-600">lightbulb</span>
                  <span>ວິທີເປີດອະນຸຍາດໃນ Chrome / Safari:</span>
                </span>

                <div className="bg-[#faf8ff] p-3 rounded-2xl border border-gray-100 flex flex-col gap-2 text-[12px] text-[#3c4a42]">
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">1</span>
                    <p className="leading-snug">
                      ກົດໄອຄອນ <strong>🔒 ແມ່ກະແຈ</strong> ຫຼື <strong>⚙️ ຕັ້ງຄ່າ</strong> ຢູ່ແຖບ URL ດ້ານເທິງຂອງບຣາວເຊີ.
                    </p>
                  </div>
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">2</span>
                    <p className="leading-snug">
                      ເລືອກ <strong>"ການອະນຸຍາດ (Permissions)"</strong> ຫຼື <strong>"Site settings"</strong>.
                    </p>
                  </div>
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">3</span>
                    <p className="leading-snug">
                      ຊອກຫາ <strong>"ສະຖານທີ່ (Location)"</strong> ແລ້ວເລືອກເປັນ <strong>"ອະນຸຍາດ (Allow)"</strong>.
                    </p>
                  </div>
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">4</span>
                    <p className="leading-snug">
                      ກົດ <strong>ຣີເຟຣຊໜ້າເວັບ (Reload Page)</strong> ແລ້ວກົດປຸ່ມ GPS ອີກຄັ້ງ.
                    </p>
                  </div>
                </div>
              </div>

              <div className="flex gap-2 pt-1">
                <button
                  type="button"
                  onClick={onClose}
                  className="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors"
                >
                  ເຂົ້າໃຈແລ້ວ, ປິດໜ້າຕ່າງ
                </button>
              </div>
            </div>
          </div>
        );
      };

      const LeafletMap = ({ lat, lng, accuracy = 15, onPositionChange, height = '220px', onOpenPermissionModal }) => {
        const mapContainerRef = useRef(null);
        const mapInstanceRef = useRef(null);
        const markerRef = useRef(null);
        const accuracyCircleRef = useRef(null);
        const currentLayersRef = useRef([]);
        const liveWatchIdRef = useRef(null);

        const [mapType, setMapType] = useState('street');
        const [isLiveMode, setIsLiveMode] = useState(false);
        const [autoFollow, setAutoFollow] = useState(true);
        const [liveAccuracy, setLiveAccuracy] = useState(accuracy);
        const [liveSpeed, setLiveSpeed] = useState(null);
        const [lastUpdateTime, setLastUpdateTime] = useState(null);
        const [isLocatingQuick, setIsLocatingQuick] = useState(false);

        const applyTileLayers = (map, type) => {
          currentLayersRef.current.forEach((layer) => map.removeLayer(layer));
          currentLayersRef.current = [];
          if (type === 'satellite') {
            const satLayer = L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19, attribution: '&copy; Esri' }
            ).addTo(map);
            const labelLayer = L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19 }
            ).addTo(map);
            currentLayersRef.current = [satLayer, labelLayer];
          } else {
            const streetLayer = L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
              {
                maxZoom: 19,
                attribution: '&copy; Esri',
              }
            ).addTo(map);
            currentLayersRef.current = [streetLayer];
          }
        };

        const updateAccuracyCircle = (map, targetLat, targetLng, targetAcc, isLive) => {
          if (accuracyCircleRef.current) {
            map.removeLayer(accuracyCircleRef.current);
          }
          if (targetAcc && targetAcc > 0 && targetAcc <= 800) {
            accuracyCircleRef.current = L.circle([targetLat, targetLng], {
              radius: targetAcc,
              color: isLive ? '#10b981' : '#006c49',
              weight: isLive ? 2 : 1.5,
              opacity: 0.85,
              fillColor: isLive ? '#10b981' : '#006c49',
              fillOpacity: isLive ? 0.2 : 0.12,
            }).addTo(map);
          }
        };

        const getMarkerIcon = (isLive) => {
          if (isLive) {
            return L.divIcon({
              className: 'custom-live-radar-pin',
              html: `
                <div style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
                  <div class="live-radar-ping" style="position: absolute; width: 44px; height: 44px; border-radius: 9999px; background: rgba(16, 185, 129, 0.45); border: 1.5px solid #10b981;"></div>
                  <div style="position: relative; width: 22px; height: 22px; border-radius: 9999px; background: #006c49; border: 3px solid #ffffff; box-shadow: 0 0 12px rgba(16,185,129,0.8), 0 3px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;">
                    <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ffffff;"></div>
                  </div>
                </div>
              `,
              iconSize: [44, 44],
              iconAnchor: [22, 22],
            });
          }
          return L.divIcon({
            className: 'custom-leaflet-pin',
            html: `
              <div style="position: relative; width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));">
                <svg width="36" height="44" viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M18 0C8.05887 0 0 8.05887 0 18C0 28.5 15.5 42.5 17.1 43.8C17.6 44.2 18.4 44.2 18.9 43.8C20.5 42.5 36 28.5 36 18C36 8.05887 27.9411 0 18 0Z" fill="#006c49" stroke="#ffffff" stroke-width="1.5"/>
                  <circle cx="18" cy="17" r="7" fill="white"/>
                  <circle cx="18" cy="17" r="4.5" fill="#10b981"/>
                </svg>
              </div>
            `,
            iconSize: [36, 44],
            iconAnchor: [18, 44],
          });
        };

        const handleQuickLocate = async () => {
          vibrateSoft(25);
          setIsLocatingQuick(true);
          try {
            const loc = await getDeviceLocation((progress) => {
              if (progress.accuracy) setLiveAccuracy(progress.accuracy);
            });
            setLiveAccuracy(loc.accuracy);
            onPositionChange(loc.lat, loc.lng, loc.accuracy, false);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.flyTo([loc.lat, loc.lng], 17, { duration: 1.2 });
              updateAccuracyCircle(mapInstanceRef.current, loc.lat, loc.lng, loc.accuracy, false);
            }
          } catch (err) {
            if (err && err.code === 1 && onOpenPermissionModal) {
              onOpenPermissionModal();
            }
          } finally {
            setIsLocatingQuick(false);
          }
        };

        const toggleLiveTracking = () => {
          vibrateSoft(25);
          if (isLiveMode) {
            if (liveWatchIdRef.current !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(liveWatchIdRef.current);
              liveWatchIdRef.current = null;
            }
            setIsLiveMode(false);
            onPositionChange(lat, lng, liveAccuracy, false);
            if (markerRef.current) {
              markerRef.current.setIcon(getMarkerIcon(false));
              markerRef.current.dragging?.enable();
            }
            if (mapInstanceRef.current) {
              updateAccuracyCircle(mapInstanceRef.current, lat, lng, liveAccuracy, false);
            }
          } else {
            if (!navigator.geolocation) {
              if (onOpenPermissionModal) onOpenPermissionModal();
              return;
            }
            setIsLiveMode(true);
            if (markerRef.current) {
              markerRef.current.setIcon(getMarkerIcon(true));
              markerRef.current.dragging?.disable();
            }

            liveWatchIdRef.current = navigator.geolocation.watchPosition(
              (pos) => {
                const newLat = Number(pos.coords.latitude.toFixed(6));
                const newLng = Number(pos.coords.longitude.toFixed(6));
                const acc = Math.round(pos.coords.accuracy || 10);
                const speedKmh = pos.coords.speed !== null && pos.coords.speed > 0
                  ? Math.round(pos.coords.speed * 3.6)
                  : 0;

                setLiveAccuracy(acc);
                setLiveSpeed(speedKmh);
                setLastUpdateTime(new Date().toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

                onPositionChange(newLat, newLng, acc, true);

                if (markerRef.current) {
                  markerRef.current.setLatLng([newLat, newLng]);
                }
                if (mapInstanceRef.current) {
                  updateAccuracyCircle(mapInstanceRef.current, newLat, newLng, acc, true);
                  if (autoFollow) {
                    mapInstanceRef.current.panTo([newLat, newLng], { animate: true, duration: 0.5 });
                  }
                }
              },
              (err) => {
                console.warn('Live GPS error:', err);
                if (err && err.code === 1 && onOpenPermissionModal) {
                  setIsLiveMode(false);
                  onOpenPermissionModal();
                }
              },
              {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 20000,
              }
            );
          }
        };

        useEffect(() => {
          if (!mapContainerRef.current) return;
          if (!mapInstanceRef.current) {
            const map = L.map(mapContainerRef.current, {
              center: [lat, lng],
              zoom: 16,
              zoomControl: false,
              attributionControl: false,
            });
            applyTileLayers(map, mapType);

            const marker = L.marker([lat, lng], { draggable: !isLiveMode, icon: getMarkerIcon(isLiveMode) }).addTo(map);

            marker.on('dragend', () => {
              if (isLiveMode) return;
              const pos = marker.getLatLng();
              onPositionChange(Number(pos.lat.toFixed(6)), Number(pos.lng.toFixed(6)), 10, false);
              updateAccuracyCircle(map, pos.lat, pos.lng, 10, false);
            });

            map.on('click', (e) => {
              if (isLiveMode) return;
              marker.setLatLng(e.latlng);
              onPositionChange(Number(e.latlng.lat.toFixed(6)), Number(e.latlng.lng.toFixed(6)), 10, false);
              updateAccuracyCircle(map, e.latlng.lat, e.latlng.lng, 10, false);
            });

            mapInstanceRef.current = map;
            markerRef.current = marker;
            updateAccuracyCircle(map, lat, lng, liveAccuracy, isLiveMode);
            setTimeout(() => map.invalidateSize(), 200);
          } else {
            if (!isLiveMode) {
              mapInstanceRef.current.flyTo([lat, lng], Math.max(mapInstanceRef.current.getZoom(), 16), { duration: 0.8 });
              if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
              updateAccuracyCircle(mapInstanceRef.current, lat, lng, liveAccuracy, false);
            }
          }
        }, [lat, lng]);

        useEffect(() => {
          if (mapInstanceRef.current) applyTileLayers(mapInstanceRef.current, mapType);
        }, [mapType]);

        useEffect(() => {
          return () => {
            if (liveWatchIdRef.current !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(liveWatchIdRef.current);
              liveWatchIdRef.current = null;
            }
          };
        }, []);

        return (
          <div className="relative w-full rounded-2xl overflow-hidden border border-emerald-900/15 shadow-sm">
            <div ref={mapContainerRef} style={{ height }} className="w-full bg-[#1b232a]" />

            {/* Top Status Banner */}
            <div className="absolute top-2 left-2 z-[400] flex flex-col gap-1 pointer-events-none">
              <div className="bg-black/85 backdrop-blur-md text-white text-[11px] font-display font-medium px-2.5 py-1 rounded-full shadow-md flex items-center gap-1.5 border border-white/20">
                {isLiveMode ? (
                  <span className="flex items-center gap-1 text-[#4edea3] font-bold">
                    <span className="w-2 h-2 rounded-full bg-[#10b981] animate-ping inline-block"></span>
                    <span>LIVE ສົດ</span>
                  </span>
                ) : (
                  <span className="w-2 h-2 rounded-full bg-[#10b981]"></span>
                )}
                <span>{Number(lat).toFixed(5)}, {Number(lng).toFixed(5)}</span>
                {liveAccuracy && (
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                    liveAccuracy <= 20 ? 'bg-emerald-600 text-white' : 'bg-amber-600 text-white'
                  }`}>
                    ±{liveAccuracy}m
                  </span>
                )}
              </div>

              {isLiveMode && (
                <div className="bg-emerald-950/90 text-emerald-200 text-[10px] px-2 py-0.5 rounded-lg border border-emerald-500/40 font-display flex items-center gap-2">
                  <span>ຄວາມໄວ: <strong>{liveSpeed || 0} km/h</strong></span>
                  {lastUpdateTime && <span>• ອັບເດດ: {lastUpdateTime}</span>}
                </div>
              )}
            </div>

            {/* Top Right: Map style toggle */}
            <div className="absolute top-2 right-2 z-[400] bg-white/95 backdrop-blur-md p-0.5 rounded-xl shadow-md border border-black/10 flex items-center">
              <button
                type="button"
                onClick={() => setMapType('street')}
                className={`px-2 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 transition-all ${
                  mapType === 'street' ? 'bg-[#006c49] text-white shadow-xs' : 'text-gray-600 hover:text-gray-900'
                }`}
              >
                <span className="material-symbols-outlined text-[14px]">map</span>
                <span>ແຜນທີ່</span>
              </button>
              <button
                type="button"
                onClick={() => setMapType('satellite')}
                className={`px-2 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 transition-all ${
                  mapType === 'satellite' ? 'bg-[#006c49] text-white shadow-xs' : 'text-gray-600 hover:text-gray-900'
                }`}
              >
                <span className="material-symbols-outlined text-[14px]">satellite_alt</span>
                <span>ດາວທຽມ</span>
              </button>
            </div>

            {/* Bottom Controls Bar: Live Mode Toggle, Auto Follow & Quick Locate */}
            <div className="absolute bottom-2 inset-x-2 z-[400] flex items-center justify-between gap-1.5 pointer-events-auto">
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={toggleLiveTracking}
                  className={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-md active:scale-95 transition-all border ${
                    isLiveMode
                      ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white border-white/40 ring-2 ring-red-400/50 animate-pulse'
                      : 'bg-white/95 hover:bg-emerald-50 text-[#006c49] border-emerald-900/15'
                  }`}
                >
                  <span className="material-symbols-outlined text-[17px]">
                    {isLiveMode ? 'sensors' : 'location_searching'}
                  </span>
                  <span>{isLiveMode ? 'ຢຸດ Live' : '🔴 ເປີດ GPS ສົດ'}</span>
                </button>

                {!isLiveMode && (
                  <button
                    type="button"
                    onClick={handleQuickLocate}
                    disabled={isLocatingQuick}
                    className="bg-white/95 hover:bg-emerald-50 text-[#006c49] text-[11px] font-bold px-2.5 py-1.5 rounded-xl shadow-md border border-emerald-900/15 flex items-center gap-1 active:scale-95 transition-all"
                    title="ລັອກສັນຍານດາວທຽມ GPS ດຽວນີ້"
                  >
                    <span className={`material-symbols-outlined text-[15px] ${isLocatingQuick ? 'animate-spin' : ''}`}>
                      {isLocatingQuick ? 'sync' : 'my_location'}
                    </span>
                    <span>{isLocatingQuick ? 'ລັອກ...' : 'GPS ຂ້ອຍ'}</span>
                  </button>
                )}
              </div>

              {isLiveMode && (
                <button
                  type="button"
                  onClick={() => {
                    vibrateSoft(10);
                    setAutoFollow(!autoFollow);
                    if (!autoFollow && mapInstanceRef.current) {
                      mapInstanceRef.current.panTo([lat, lng]);
                    }
                  }}
                  className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold shadow-md active:scale-95 transition-all flex items-center gap-1 border ${
                    autoFollow
                      ? 'bg-[#006c49] text-white border-emerald-500'
                      : 'bg-white/95 text-gray-700 border-gray-200'
                  }`}
                  title="ເລື່ອນຈໍຕິດຕາມອັດຕະໂນມັດ"
                >
                  <span className="material-symbols-outlined text-[15px]">
                    {autoFollow ? 'gps_fixed' : 'gps_not_fixed'}
                  </span>
                  <span>{autoFollow ? 'Follow: ເປີດ' : 'Follow: ປິດ'}</span>
                </button>
              )}
            </div>
          </div>
        );
      };

      const GpsModal = ({ isOpen, onClose, currentLat, currentLng, onUpdateLocation, onShowToast, onOpenPermissionModal, permState }) => {
        const [loading, setLoading] = useState(false);
        const [liveAccuracy, setLiveAccuracy] = useState(null);
        const [manualLat, setManualLat] = useState(currentLat || 18.0293);
        const [manualLng, setManualLng] = useState(currentLng || 102.6322);

        useEffect(() => {
          setManualLat(currentLat);
          setManualLng(currentLng);
        }, [currentLat, currentLng, isOpen]);

        if (!isOpen) return null;

        const LAO_PRESETS = [
          { name: 'ບຸມຈອມແຈ້ງ (ວຽງຈັນ)', lat: 18.0293, lng: 102.6322 },
          { name: 'ປະຕູໄຊ ວຽງຈັນ', lat: 17.9757, lng: 102.6331 },
          { name: 'ຕະຫຼາດເຊົ້າ ວຽງຈັນ', lat: 17.9642, lng: 102.6143 },
          { name: 'ມ.ຊ ດົງໂດກ', lat: 18.0416, lng: 102.6319 },
          { name: 'ຫຼວງພະບາງ', lat: 19.8894, lng: 102.1352 },
          { name: 'ປາກເຊ', lat: 15.1202, lng: 105.7823 },
          { name: 'ສະຫວັນນະເຂດ', lat: 16.5562, lng: 104.7521 }
        ];

        const handleRequestGps = async () => {
          vibrateSoft(30);
          setLoading(true);
          setLiveAccuracy(null);
          try {
            const loc = await getDeviceLocation((progress) => {
              if (progress.accuracy) {
                setLiveAccuracy(progress.accuracy);
                setManualLat(progress.lat);
                setManualLng(progress.lng);
              }
            });
            onUpdateLocation(loc.lat, loc.lng, loc.accuracy);
            onShowToast(`ລັອກ GPS ສຳເລັດ! ຄວາມແມ່ນຍຳ: ±${loc.accuracy} ແມັດ (${loc.source})`, 'success');
            onClose();
          } catch (err) {
            if (err && err.code === 1) {
              onShowToast('ກະລຸນາອະນຸຍາດສິດ GPS ໃນບຣາວເຊີ', 'warning');
              if (onOpenPermissionModal) onOpenPermissionModal();
            } else {
              onShowToast('ກະລຸນາເປີດສິດ Location/GPS ຫຼື ເລືອກຈຸດແນະນຳດ້ານລຸ່ມ', 'warning');
            }
          } finally {
            setLoading(false);
          }
        };

        const handleSaveManual = (e) => {
          e.preventDefault();
          const lat = Number(parseFloat(manualLat).toFixed(6));
          const lng = Number(parseFloat(manualLng).toFixed(6));
          if (isNaN(lat) || isNaN(lng)) {
            onShowToast('ກະລຸນາໃສ່ພິກັດຕົວເລກທີ່ຖືກຕ້ອງ', 'warning');
            return;
          }
          onUpdateLocation(lat, lng, 10);
          onShowToast(`ບັນທຶກພິກັດ: ${lat}, ${lng}`, 'success');
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-emerald-900/10 flex flex-col gap-4 max-h-[90vh] overflow-y-auto no-scrollbar">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-2xl bg-[#ecfdf5] flex items-center justify-center text-[#006c49]">
                    <span className="material-symbols-outlined text-[24px]">satellite_alt</span>
                  </div>
                  <div>
                    <h3 className="font-display font-bold text-base text-[#006c49] leading-tight">ດຶງຕຳແໜ່ງ GPS ແມ່ນຍຳສູງ</h3>
                    <p className="text-[11px] text-[#3c4a42]">ຈັບສັນຍານດາວທຽມລະດັບແມັດ (High Precision)</p>
                  </div>
                </div>
                <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-400 flex items-center justify-center">
                  <span className="material-symbols-outlined text-[18px]">close</span>
                </button>
              </div>

              {/* Status Box */}
              <div className="bg-[#faf8ff] p-3 rounded-2xl border border-[#dae2fd]/60 flex flex-col gap-2 text-xs text-[#3c4a42]">
                <div className="flex justify-between items-center">
                  <span className="font-medium text-[#131b2e]">ພິກັດປັດຈຸບັນ:</span>
                  <span className="font-display font-bold text-[#006c49] bg-[#ecfdf5] px-2 py-0.5 rounded-md">
                    {Number(currentLat).toFixed(5)}, {Number(currentLng).toFixed(5)}
                  </span>
                </div>
                {liveAccuracy && (
                  <div className="flex justify-between items-center pt-1 border-t border-gray-100">
                    <span className="font-medium text-[#131b2e]">ຄວາມແມ່ນຍຳທີ່ຈັບໄດ້:</span>
                    <span className={`font-display font-bold px-2 py-0.5 rounded-md ${
                      liveAccuracy <= 20 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                    }`}>
                      ±{liveAccuracy} ແມັດ
                    </span>
                  </div>
                )}
                {/* Permission indicator link */}
                <div className="flex justify-between items-center pt-1 border-t border-gray-100 text-[11px]">
                  <span>ສິດອະນຸຍາດ GPS:</span>
                  <button
                    type="button"
                    onClick={() => { if (onOpenPermissionModal) onOpenPermissionModal(); }}
                    className="font-bold underline flex items-center gap-1 text-[#006c49]"
                  >
                    <span>{permState === 'granted' ? 'ອະນຸຍາດແລ້ວ ✓' : permState === 'denied' ? 'ຖືກບລັອກ (ແກ້ໄຂ)' : 'ກວດສອບສິດ'}</span>
                    <span className="material-symbols-outlined text-[13px]">open_in_new</span>
                  </button>
                </div>
              </div>

              <div className="flex flex-col gap-2">
                <button
                  type="button"
                  onClick={handleRequestGps}
                  disabled={loading}
                  className="w-full py-3.5 px-4 bg-[#006c49] hover:bg-[#005236] text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-md active:scale-95 transition-all disabled:opacity-75 text-[13px]"
                >
                  {loading ? (
                    <>
                      <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>ກຳລັງສະແກນດາວທຽມ GPS {liveAccuracy ? `(±${liveAccuracy}m)...` : '...'}</span>
                    </>
                  ) : (
                    <>
                      <span className="material-symbols-outlined text-[20px]">my_location</span>
                      <span>ກົດດຶງ GPS ປັດຈຸບັນ (ລັອກດາວທຽມ)</span>
                    </>
                  )}
                </button>
              </div>

              {/* Lao landmarks presets */}
              <div>
                <label className="text-[11px] font-bold text-gray-500 block mb-1.5">ຫຼື ເລືອກຈຸດແນະນຳໃນລາວ:</label>
                <div className="grid grid-cols-2 gap-1.5">
                  {LAO_PRESETS.map((preset) => (
                    <button
                      key={preset.name}
                      type="button"
                      onClick={() => {
                        vibrateSoft();
                        onUpdateLocation(preset.lat, preset.lng, 15);
                        onShowToast(`ເລືອກ ${preset.name}`, 'info');
                        onClose();
                      }}
                      className="px-2.5 py-1.5 bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] text-[11px] font-semibold rounded-xl text-left truncate border border-[#a7f3d0]/60 active:scale-95 transition-all"
                    >
                      📍 {preset.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Manual coordinate inputs */}
              <form onSubmit={handleSaveManual} className="border-t border-gray-100 pt-3 flex flex-col gap-2">
                <span className="text-[11px] font-bold text-gray-500">ຫຼື ປ້ອນພິກັດ Latitude, Longitude:</span>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="number"
                    step="any"
                    value={manualLat}
                    onChange={(e) => setManualLat(e.target.value)}
                    placeholder="Latitude"
                    className="w-full px-2.5 py-1.5 bg-[#faf8ff] rounded-xl border border-gray-200 text-xs font-display focus:outline-none focus:ring-1 focus:ring-[#10b981]"
                  />
                  <input
                    type="number"
                    step="any"
                    value={manualLng}
                    onChange={(e) => setManualLng(e.target.value)}
                    placeholder="Longitude"
                    className="w-full px-2.5 py-1.5 bg-[#faf8ff] rounded-xl border border-gray-200 text-xs font-display focus:outline-none focus:ring-1 focus:ring-[#10b981]"
                  />
                </div>
                <div className="flex gap-2 mt-1">
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors"
                  >
                    ປິດ
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 bg-[#006c49] hover:bg-[#005236] text-white font-bold rounded-xl text-xs shadow-xs transition-all active:scale-95"
                  >
                    ບັນທຶກພິກັດ
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      const PRESET_ICONS = [
        { icon: 'point_of_sale', label: 'POS' },
        { icon: 'local_cafe', label: 'ກາເຟ' },
        { icon: 'restaurant', label: 'ອາຫານ' },
        { icon: 'bakery_dining', label: 'ເບເກີຣີ' },
        { icon: 'lunch_dining', label: 'ເບີເກີ' },
        { icon: 'local_bar', label: 'ບາຣ໌' },
        { icon: 'storefront', label: 'ຮ້ານຄ້າ' },
        { icon: 'shopping_basket', label: 'ມິນິມາດ' },
      ];

      const StoreSettingsModal = ({ isOpen, onClose, profile, onUpdateProfile, onShowToast }) => {
        const [storeName, setStoreName] = useState(profile.name);
        const [ownerName, setOwnerName] = useState(profile.ownerName || profile.cashierName || '');
        const [phone, setPhone] = useState(profile.phone || '');
        const [logoUrl, setLogoUrl] = useState(profile.logoUrl || null);
        const [logoIcon, setLogoIcon] = useState(profile.logoIcon || 'point_of_sale');
        const [isUploading, setIsUploading] = useState(false);
        const fileInputRef = useRef(null);

        if (!isOpen) return null;

        const handleUploadLogo = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            setIsUploading(true);
            const compressed = await compressImage(file, 300, 0.85);
            setLogoUrl(compressed);
            onShowToast('ອັບໂຫຼດໂລໂກ້ຮ້ານຮຽບຮ້ອຍ', 'success');
          } catch (err) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການອັບໂຫຼດ', 'error');
          } finally {
            setIsUploading(false);
          }
        };

        const handleSave = (e) => {
          e.preventDefault();
          if (!storeName.trim()) {
            onShowToast('ກະລຸນາໃສ່ຊື່ຮ້ານຄ້າ', 'warning');
            return;
          }
          vibrateSoft(30);
          onUpdateProfile({
            name: storeName.trim(),
            ownerName: ownerName.trim(),
            cashierName: ownerName.trim(),
            phone: phone.trim(),
            logoUrl,
            logoIcon,
          });
          onShowToast('ບັນທຶກຂໍ້ມູນຮ້ານສຳເລັດ!', 'success');
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-emerald-900/10 flex flex-col gap-4 max-h-[90vh] overflow-y-auto no-scrollbar">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 text-[#006c49]">
                  <span className="material-symbols-outlined text-[24px]">storefront</span>
                  <h3 className="font-display font-bold text-lg leading-tight">ຕັ້ງຄ່າຊື່ຮ້ານ & ໂລໂກ້</h3>
                </div>
                <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-400 hover:text-gray-700 flex items-center justify-center transition-colors">
                  <span className="material-symbols-outlined text-[20px]">close</span>
                </button>
              </div>

              {/* Preview */}
              <div className="bg-[#faf8ff] p-3.5 rounded-2xl border border-[#dae2fd]/60 flex items-center gap-3">
                {logoUrl ? (
                  <img src={logoUrl} alt="Logo" className="w-12 h-12 rounded-xl object-cover shadow-sm border border-emerald-900/10 bg-white shrink-0" />
                ) : (
                  <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-[#006c49] to-[#10b981] flex items-center justify-center text-white shrink-0 shadow-sm">
                    <span className="material-symbols-outlined text-[26px]">{logoIcon || 'point_of_sale'}</span>
                  </div>
                )}
                <div className="min-w-0 flex-1">
                  <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider block">ຕົວຢ່າງໂລໂກ້</span>
                  <h4 className="font-display font-bold text-[16px] text-[#006c49] truncate">{storeName.trim() || 'ຊື່ຮ້ານ'}</h4>
                  <p className="text-[11px] text-[#3c4a42] truncate">{phone.trim() || '-'}</p>
                </div>
              </div>

              <form onSubmit={handleSave} className="flex flex-col gap-3.5">
                <div className="flex flex-col gap-2">
                  <label className="text-[12px] font-bold text-[#3c4a42] flex items-center justify-between">
                    <span>ໂລໂກ້ຮ້ານ (Logo)</span>
                    {logoUrl && (
                      <button type="button" onClick={() => setLogoUrl(null)} className="text-[#ba1a1a] hover:underline text-[11px]">
                        ລຶບຮູບໂລໂກ້
                      </button>
                    )}
                  </label>
                  <input type="file" ref={fileInputRef} accept="image/*" onChange={handleUploadLogo} className="hidden" />
                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    disabled={isUploading}
                    className="w-full py-2.5 px-3 bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] rounded-xl text-[12px] font-bold flex items-center justify-center gap-1.5 border border-[#a7f3d0] transition-colors"
                  >
                    <span className="material-symbols-outlined text-[18px]">photo_camera</span>
                    <span>{isUploading ? 'ກຳລັງອັບໂຫຼດ...' : logoUrl ? 'ປ່ຽນຮູບໂລໂກ້' : 'ອັບໂຫຼດຮູບໂລໂກ້'}</span>
                  </button>

                  {!logoUrl && (
                    <div className="flex flex-col gap-1.5 mt-1">
                      <span className="text-[11px] text-gray-500 font-semibold">ຫຼື ເລືອກໄອຄອນ:</span>
                      <div className="grid grid-cols-4 gap-1.5">
                        {PRESET_ICONS.map((item) => (
                          <button
                            key={item.icon}
                            type="button"
                            onClick={() => { vibrateSoft(10); setLogoIcon(item.icon); }}
                            className={`p-2 rounded-xl flex flex-col items-center gap-1 text-[10px] font-bold transition-all ${
                              logoIcon === item.icon
                                ? 'bg-[#006c49] text-white shadow-sm'
                                : 'bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200'
                            }`}
                          >
                            <span className="material-symbols-outlined text-[18px]">{item.icon}</span>
                            <span className="truncate">{item.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ຊື່ຮ້ານຄ້າ *</label>
                  <input
                    type="text"
                    required
                    value={storeName}
                    onChange={(e) => setStoreName(e.target.value)}
                    placeholder="ຊື່ຮ້ານ POS"
                    className="w-full px-3.5 py-2.5 bg-[#faf8ff] rounded-xl border border-gray-200 text-[14px] font-bold text-[#006c49] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                  />
                </div>

                <div>
                  <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ຊື່ພະນັກງານຂາຍ / ແຄັດເຊຍ</label>
                  <input
                    type="text"
                    value={ownerName}
                    onChange={(e) => setOwnerName(e.target.value)}
                    placeholder="ພະນັກງານຂາຍ"
                    className="w-full px-3.5 py-2.5 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                  />
                </div>

                <div>
                  <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ເບີໂທຕິດຕໍ່ຮ້ານ</label>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    placeholder="020 xxxx xxxx"
                    className="w-full px-3.5 py-2.5 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] font-display text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-[13px] transition-colors">
                    ຍົກເລີກ
                  </button>
                  <button type="submit" className="flex-1 py-2.5 bg-[#006c49] hover:bg-[#005236] text-white font-bold rounded-xl text-[13px] shadow-sm transition-all active:scale-95 flex items-center justify-center gap-1.5">
                    <span className="material-symbols-outlined text-[18px]">check</span>
                    <span>ບັນທຶກ</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      const Header = ({ activeTab, profile, onOpenGpsModal, onQuickSync, onEditStore }) => {
        const getTabSubtitle = () => {
          switch (activeTab) {
            case 'pos-menu': return 'ລາຍການສັ່ງຊື້';
            case 'cart-and-whatsapp': return 'ກະຕ່າ & ສົ່ງ WhatsApp';
            case 'sales-dashboard': return 'ສະຫຼຸບຍອດຂາຍ';
            case 'order-history': return 'ປະຫວັດບິນ';
            case 'catalog-settings': return 'ຈັດການເມນູ';
            default: return '';
          }
        };

        return (
          <header className="fixed top-0 inset-x-0 z-50 bg-[#faf8ff]/90 backdrop-blur-xl shadow-[0_1px_12px_rgba(0,108,73,0.06)] border-b border-emerald-900/10">
            <div className="h-16 max-w-lg mx-auto px-4 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0 flex-1">
                <button onClick={onEditStore} className="relative group shrink-0 active:scale-95 transition-transform" title="ຕັ້ງຄ່າຮ້ານ">
                  {profile.logoUrl ? (
                    <img src={profile.logoUrl} alt={profile.name} className="w-10 h-10 rounded-xl object-cover shadow-sm border border-emerald-900/10 bg-white" />
                  ) : (
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#006c49] to-[#10b981] flex items-center justify-center text-white shrink-0 shadow-sm shadow-emerald-900/20">
                      <span className="material-symbols-outlined text-[24px]">{profile.logoIcon || 'point_of_sale'}</span>
                    </div>
                  )}
                  <span className="absolute -bottom-1 -right-1 w-4 h-4 bg-white rounded-full shadow-xs flex items-center justify-center text-[#006c49] border border-emerald-100">
                    <span className="material-symbols-outlined text-[10px]">edit</span>
                  </span>
                </button>
                <div className="flex flex-col min-w-0">
                  <button onClick={onEditStore} className="flex items-center gap-1 group text-left max-w-full">
                    <span className="font-display font-bold text-[16px] text-[#006c49] truncate leading-tight tracking-tight group-hover:underline">
                      {profile.name}
                    </span>
                    <span className="material-symbols-outlined text-[13px] text-[#006c49]/70 group-hover:text-[#006c49] shrink-0">edit</span>
                  </button>

                  >

      };

      const CartTab = ({
        products,
        cart,
        onUpdateQty,
        onSetQty,
        onClearCart,
        profile,
        onUpdateProfile,
        onOrderCompleted,
        onShowToast,
        onGoToMenu,
        onOpenPermissionModal,
      }) => {
        const [discount, setDiscount] = useState(0);
        const [orderNotes, setOrderNotes] = useState('');
        const [isLocating, setIsLocating] = useState(false);
        const [gpsProgressAcc, setGpsProgressAcc] = useState(null);
        const [directPhone, setDirectPhone] = useState(profile.phone || '02055551234');
        const [isCompressingPhoto, setIsCompressingPhoto] = useState(false);
        const [cashGiven, setCashGiven] = useState('');
        const [showClearConfirm, setShowClearConfirm] = useState(false);

        const cameraInputRef = useRef(null);
        const galleryInputRef = useRef(null);

        const cartItems = useMemo(() => {
          const list = [];
          for (const [productId, qty] of Object.entries(cart)) {
            if (qty > 0) {
              const prod = products.find((p) => p.id === productId);
              if (prod) list.push({ product: prod, quantity: qty });
            }
          }
          return list;
        }, [cart, products]);

        const subtotal = useMemo(() => {
          return cartItems.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
        }, [cartItems]);

        const netTotal = Math.max(0, subtotal - discount);

        const handleDetectGps = async () => {
          vibrateSoft(30);
          setIsLocating(true);
          setGpsProgressAcc(null);
          try {
            const loc = await getDeviceLocation((progress) => {
              if (progress.accuracy) setGpsProgressAcc(progress.accuracy);
            });
            onUpdateProfile({ lat: loc.lat, lng: loc.lng, gpsAccuracy: loc.accuracy });
            onShowToast(`ລັອກ GPS ສຳເລັດ! ຄວາມແມ່ນຍຳ: ±${loc.accuracy} ແມັດ (${loc.source})`, 'success');
          } catch (err) {
            if (err && err.code === 1 && onOpenPermissionModal) {
              onOpenPermissionModal();
            } else {
              onShowToast('ບໍ່ສາມາດດຶງ GPS ໄດ້ ກະລຸນາເປີດສິດ Location ຫຼື ເລືອກຈາກແຜນທີ່', 'warning');
            }
          } finally {
            setIsLocating(false);
            setGpsProgressAcc(null);
          }
        };

        const handlePhotoUpload = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            setIsCompressingPhoto(true);
            const compressed = await compressImage(file, 640, 0.7);
            onUpdateProfile({ photoUrl: compressed });
            onShowToast('ອັບໂຫຼດຮູບໜ້າຮ້ານແລ້ວ', 'success');
          } catch (err) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການອັບໂຫຼດຮູບ', 'error');
          } finally {
            setIsCompressingPhoto(false);
          }
        };

        const createOrderObject = (orderId) => ({
          id: orderId || `ORD-${Math.floor(100000 + Math.random() * 900000)}`,
          createdAt: new Date().toISOString(),
          status: 'pending',
          items: cartItems.map((item) => ({
            productId: item.product.id,
            productName: item.product.name,
            productNameEn: item.product.nameEn,
            category: item.product.category,
            quantity: item.quantity,
            unitPrice: item.product.price,
          })),
          subtotal,
          discount,
          total: netTotal,
          storeName: profile.name,
          customerName: profile.customerName || profile.ownerName || 'ລູກຄ້າທົ່ວໄປ',
          customerPhone: profile.customerPhone || directPhone || profile.phone,
          ownerName: profile.ownerName || profile.cashierName,
          cashierName: profile.cashierName,
          contactPhone: directPhone,
          phone: directPhone,
          notes: orderNotes,
          location: { lat: profile.lat, lng: profile.lng },
          storePhoto: profile.photoUrl || undefined,
          dispatchMode: profile.whatsappMode,
        });

        const handleSendWhatsApp = async () => {
          vibrateSoft(50);
          if (cartItems.length === 0) {
            onShowToast('ກະຕ່າຫວ່າງເປົ່າ!', 'warning');
            return;
          }
          const orderId = `ORD-${Math.floor(100000 + Math.random() * 900000)}`;
          const textSlip = buildWhatsAppSlip(cartItems, subtotal, discount, netTotal, orderNotes, profile, orderId);

          const newOrder = createOrderObject(orderId);
          onOrderCompleted(newOrder);

          try {
            confetti({ particleCount: 70, spread: 60, origin: { y: 0.8 } });
            playFeedbackSound('success');
          } catch (e) {}

          // Native Share Sheet with Real Image if available
          if (profile.photoUrl && typeof navigator !== 'undefined' && navigator.share) {
            try {
              const res = await fetch(profile.photoUrl);
              const blob = await res.blob();
              const file = new File([blob], `${profile.name}-slip.jpg`, { type: blob.type || 'image/jpeg' });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                  title: `${profile.name} - ${orderId}`,
                  text: textSlip,
                  files: [file],
                });
                onShowToast('ສົ່ງຂໍ້ມູນໄປ WhatsApp ສຳເລັດ!', 'success');
                return;
              }
            } catch (err) {
              if (err.name === 'AbortError') return;
            }
          }

          // WhatsApp direct/group link
          const encoded = encodeURIComponent(textSlip);
          let targetUrl = '';
          if (profile.whatsappMode === 'group') {
            targetUrl = `https://api.whatsapp.com/send?text=${encoded}`;
          } else {
            let cleanPhone = (directPhone || '').replace(/[\s\-\(\)\+]/g, '');
            if (cleanPhone.startsWith('020')) {
              cleanPhone = '85620' + cleanPhone.slice(3);
            } else if (cleanPhone.startsWith('20')) {
              cleanPhone = '856' + cleanPhone;
            }
            targetUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encoded}`;
          }
          window.open(targetUrl, '_blank');

        const [timeRange, setTimeRange] = useState('all'); // 'today', 'week', 'month', 'all'
        const [activeBarIndex, setActiveBarIndex] = useState(null);

        // Filter orders based on chosen time range
        const filteredOrders = useMemo(() => {
          if (timeRange === 'all') return orders;
          const now = new Date();
          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
          const sevenDaysAgo = startOfToday - 6 * 24 * 3600 * 1000;
          const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

          return orders.filter((o) => {
            const time = new Date(o.createdAt).getTime();
            if (timeRange === 'today') return time >= startOfToday;
            if (timeRange === 'week') return time >= sevenDaysAgo;
            if (timeRange === 'month') return time >= startOfMonth;
            return true;
          });
        }, [orders, timeRange]);

        // Comprehensive analytics metrics
        const stats = useMemo(() => {
          const totalSales = filteredOrders.reduce((sum, o) => sum + (o.total || 0), 0);
          const totalOrders = filteredOrders.length;
          const deliveredOrders = filteredOrders.filter((o) => o.status === 'delivered').length;
          const pendingOrders = filteredOrders.filter((o) => (o.status || 'pending') === 'pending').length;
          const avgOrder = totalOrders > 0 ? Math.round(totalSales / totalOrders) : 0;
          const deliveryRate = totalOrders > 0 ? Math.round((deliveredOrders / totalOrders) * 100) : 0;

          let totalItemsSold = 0;
          const itemStats = {};
          const catSales = {
            drinks: { name: 'ເຄື່ອງດື່ມ', icon: 'local_cafe', count: 0, revenue: 0, color: '#006c49' },
            food: { name: 'ອາຫານ', icon: 'restaurant', count: 0, revenue: 0, color: '#f59e0b' },
            desserts: { name: 'ຂອງຫວານ', icon: 'bakery_dining', count: 0, revenue: 0, color: '#ec4899' },
          };

          let groupCount = 0;
          let directCount = 0;

          filteredOrders.forEach((o) => {
            if (o.dispatchMode === 'direct') directCount++;
            else groupCount++;

            (o.items || []).forEach((it) => {
              totalItemsSold += it.quantity;
              const catKey = it.category || 'drinks';
              if (catSales[catKey]) {
                catSales[catKey].count += it.quantity;
                catSales[catKey].revenue += (it.unitPrice || 0) * it.quantity;
              }

              if (!itemStats[it.productName]) {
                const prod = products.find((p) => p.name === it.productName || p.id === it.productId);
                itemStats[it.productName] = {
                  name: it.productName,
                  nameEn: it.productNameEn || '',
                  category: it.category || 'drinks',
                  quantity: 0,
                  revenue: 0,
                  image: prod?.image || 'https://placehold.co/100x100/ecfdf5/006c49?text=' + encodeURIComponent(it.productName.slice(0, 2)),
                };
              }
              itemStats[it.productName].quantity += it.quantity;
              itemStats[it.productName].revenue += (it.unitPrice || 0) * it.quantity;
            });
          });

          const topItems = Object.values(itemStats)
            .sort((a, b) => b.quantity - a.quantity || b.revenue - a.revenue)
            .slice(0, 5);

          // 7-day trend chart calculation
          const now = new Date();
          const last7Days = [];

              const oDate = new Date(o.createdAt).toISOString().slice(0, 10);
              return oDate === dateStr;
            }).reduce((sum, o) => sum + (o.total || 0), 0);

            last7Days.push({
              dateStr,
              dayLabel,
              shortDate,
              total: dayTotal,
            });
          }

            totalSales,
            totalOrders,
            deliveredOrders,

      const OrdersTab = ({ orders, onDeleteOrder, onClearAllOrders, onToggleOrderStatus, profile, onShowToast }) => {
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [orderToDelete, setOrderToDelete] = useState(null);
        const [filterStatus, setFilterStatus] = useState('all'); // 'all', 'pending', 'delivered'
        const [selectedOrderDetail, setSelectedOrderDetail] = useState(null);
        const [expandedOrders, setExpandedOrders] = useState({});

        const toggleExpand = (id) => {
          vibrateSoft(10);
          setExpandedOrders(prev => ({ ...prev, [id]: !prev[id] }));
        };

        const filteredOrders = useMemo(() => {
          if (filterStatus === 'all') return orders;
          return orders.filter(o => (o.status || 'pending') === filterStatus);
        }, [orders, filterStatus]);

        const pendingCount = useMemo(() => {
          return orders.filter(o => (o.status || 'pending') === 'pending').length;
        }, [orders]);

        const deliveredCount = useMemo(() => {
          return orders.filter(o => o.status === 'delivered').length;
        }, [orders]);

        const handleResendWhatsApp = (order) => {
          vibrateSoft();
          const cartItems = order.items.map((it) => ({
            product: {
              id: it.productId,
              name: it.productName,
              nameEn: it.productNameEn,
              sub: '',
              category: it.category,
              price: it.unitPrice,
              image: '',
            },
            quantity: it.quantity,
          }));
          const orderProfile = {
            ...profile,
            name: order.storeName || profile.name,
            customerName: order.customerName || profile.customerName,
            customerPhone: order.customerPhone || profile.customerPhone,
            ownerName: order.ownerName || profile.ownerName,
            lat: order.location?.lat ?? profile.lat,
            lng: order.location?.lng ?? profile.lng,
            photoUrl: order.storePhoto ?? profile.photoUrl,
          };
          const textSlip = buildWhatsAppSlip(
            cartItems,
            order.subtotal,
            order.discount,
            order.total,
            order.notes || '',
            orderProfile,
            order.id
          );
          const encoded = encodeURIComponent(textSlip);
          let targetUrl = `https://api.whatsapp.com/send?text=${encoded}`;
          if (order.dispatchMode === 'direct' && (order.customerPhone || order.contactPhone)) {
            let cleanPhone = (order.customerPhone || order.contactPhone).replace(/[\s\-\(\)\+]/g, '');
            if (cleanPhone.startsWith('020')) cleanPhone = '85620' + cleanPhone.slice(3);
            targetUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encoded}`;
          }
          window.open(targetUrl, '_blank');
          onShowToast(`ເປີດ WhatsApp ສົ່ງບິນ ${order.id}...`, 'info');
        };

        const handleCopyOrderSlip = async (order) => {
          vibrateSoft();
          const cartItems = order.items.map((it) => ({
            product: {
              id: it.productId,
              name: it.productName,
              nameEn: it.productNameEn,
              sub: '',
              category: it.category,
              price: it.unitPrice,
              image: '',
            },
            quantity: it.quantity,
